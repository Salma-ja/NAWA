<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAWA LAB</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #050d1a;
      --bg-soft: #0a1628;
      --bg-end: #0a1628;
      --panel: rgba(22, 37, 64, 0.76);
      --panel-strong: rgba(22, 37, 64, 0.94);
      --panel-solid: #162540;
      --line: rgba(91, 163, 255, 0.16);
      --primary: #1a6fe8;
      --primary-strong: #3d8eff;
      --secondary: #6c3fe8;
      --accent: #a78bfa;
      --success: #1a8c5a;
      --text: #f0f4ff;
      --muted: #8896ab;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --container: 1180px;
      --orb-one: rgba(108, 63, 232, 0.42);
      --orb-two: rgba(26, 111, 232, 0.42);
      --orb-three: rgba(167, 139, 250, 0.2);
      --eyebrow-bg: rgba(94, 231, 255, 0.08);
      --eyebrow-border: rgba(94, 231, 255, 0.14);
      --eyebrow-text: #c6f7ff;
      --hero-gradient: linear-gradient(135deg, #ffffff 0%, #9bf2ff 40%, #92c7ff 70%, #b4a7ff 100%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, var(--orb-one), transparent 28%),
        radial-gradient(circle at 85% 15%, var(--orb-two), transparent 24%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 45%, var(--bg-end) 100%);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
    }

    .app.theme-light {
      --bg: #f3f7ff;
      --bg-soft: #e8f0ff;
      --bg-end: #dfeaff;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --panel-solid: #ffffff;
      --line: rgba(26, 111, 232, 0.14);
      --text: #0a1628;
      --muted: #53657d;
      --shadow: 0 18px 50px rgba(39, 72, 122, 0.14);
      --orb-one: rgba(108, 63, 232, 0.16);
      --orb-two: rgba(26, 111, 232, 0.14);
      --orb-three: rgba(167, 139, 250, 0.12);
      --eyebrow-bg: rgba(26, 111, 232, 0.08);
      --eyebrow-border: rgba(26, 111, 232, 0.14);
      --eyebrow-text: #1c4fa3;
      --hero-gradient: linear-gradient(135deg, #0a1628 0%, #1a6fe8 55%, #6c3fe8 100%);
    }

    a { color: inherit; text-decoration: none; }

    .app {
      position: relative;
      min-height: 100vh;
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(12px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
      animation: float 10s ease-in-out infinite;
    }

    .orb.one {
      width: 320px; height: 320px;
      top: 80px; left: -90px;
      background: radial-gradient(circle, var(--orb-one), rgba(108, 63, 232, 0));
    }

    .orb.two {
      width: 380px; height: 380px;
      right: -120px; top: 240px;
      background: radial-gradient(circle, var(--orb-two), rgba(26, 111, 232, 0));
      animation-delay: -2s;
    }

    .orb.three {
      width: 260px; height: 260px;
      left: 45%; bottom: 60px;
      background: radial-gradient(circle, var(--orb-three), rgba(167, 139, 250, 0));
      animation-delay: -5s;
    }

    .shell {
      position: relative;
      z-index: 1;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    .nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 18px 28px;
      margin-top: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(11, 20, 34, 0.92), rgba(10, 19, 32, 0.82));
      backdrop-filter: blur(10px);
      position: sticky;
      top: 12px;
      z-index: 10;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--panel-solid);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 0 0 auto;
      position: relative;
      isolation: isolate;
    }

    .brand-wordmark {
      display: block;
    }

    .brand-nucleus {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #6df3ff 0%, #23d8f4 45%, #00a9d0 100%);
      box-shadow:
        0 0 16px rgba(35, 216, 244, 0.5);
      position: relative;
      z-index: 2;
    }

    .brand-orbit-ring,
    .brand-orbit-ring-two {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      margin-top: -14px;
      border: 2px solid #12d6f3;
      border-radius: 50%;
      opacity: 0.95;
      pointer-events: none;
      z-index: 1;
      box-shadow: 0 0 10px rgba(18, 214, 243, 0.18);
    }

    .brand-orbit-ring {
      transform: rotate(0deg);
      animation: orbitSpin 5.6s linear infinite;
    }

    .brand-orbit-ring-two {
      transform: rotate(90deg);
      animation: orbitSpinReverse 4.8s linear infinite;
    }

    .brand-orbit-dot,
    .brand-orbit-dot-two {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px;
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;
    }

    .brand-orbit-dot {
      background: #12d6f3;
      box-shadow: 0 0 10px rgba(18, 214, 243, 0.8);
      animation: orbitDot 5.6s linear infinite;
    }

    .brand-orbit-dot-two {
      width: 6px;
      height: 6px;
      margin: -3px;
      background: rgba(255, 255, 255, 0.42);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
      animation: orbitDotReverse 4.8s linear infinite;
    }

    .brand-wordmark {
      color: var(--text);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 42px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-links a,
    .brand,
    .btn,
    .card,
    .stat,
    .experiment-panel,
    .pill,
    .timeline-item,
    .cta,
    .dashboard {
      transition: background 0.35s ease, border-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
    }

    .toggle-btn {
      min-width: auto;
    }

    .icon-btn,
    .lang-btn {
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
    }

    .icon-btn svg,
    .lang-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .lang-btn span:last-child {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 14px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      box-shadow: 0 16px 36px rgba(108, 63, 232, 0.24);
      padding-inline: 24px;
    }

    .btn-secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      align-items: center;
      padding: 38px 0 56px;
    }

    .eyebrow {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--eyebrow-bg);
      border: 1px solid var(--eyebrow-border);
      color: var(--eyebrow-text);
      font-size: 13px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 18px;
      font-size: clamp(44px, 6vw, 78px);
      line-height: 0.96;
      letter-spacing: -0.05em;
    }

    .hero h1 span {
      background: var(--hero-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 34px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      backdrop-filter: blur(10px);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
    }

    .hero-visual {
      position: relative;
      min-height: 620px;
    }

    .dashboard {
      position: relative;
      height: 100%;
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, var(--panel-strong), rgba(7, 22, 37, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 22px;
    }

    .dashboard::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
    }

    .visual-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
      margin-bottom: 22px;
    }

    .window-dots {
      display: flex;
      gap: 8px;
    }

    .window-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.24);
    }

    .window-dots span:nth-child(1) { background: #ff6b7d; }
    .window-dots span:nth-child(2) { background: #ffcc66; }
    .window-dots span:nth-child(3) { background: #2fe296; }

    .mini-chip {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #dce7ff;
    }

    .planet-wrap {
      position: relative;
      display: grid;
      place-items: center;
      margin-top: 12px;
      min-height: 320px;
      z-index: 1;
    }

    .planet {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.08) 14%, transparent 15%),
        radial-gradient(circle at 35% 35%, #5ba3ff 0%, #1a6fe8 52%, #6c3fe8 100%);
      box-shadow:
        inset -24px -24px 60px rgba(0,0,0,0.35),
        0 0 60px rgba(108, 63, 232, 0.28);
      position: relative;
      animation: pulse 6s ease-in-out infinite;
    }

    .planet::after {
      content: "";
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      border: 1px solid rgba(91, 163, 255, 0.2);
    }

    .orbit {
      position: absolute;
      border: 1px dashed rgba(148, 211, 255, 0.18);
      border-radius: 50%;
      animation: spin 18s linear infinite;
    }

    .orbit.one { width: 280px; height: 280px; }
    .orbit.two {
      width: 340px; height: 340px;
      animation-direction: reverse;
      animation-duration: 24s;
    }

    .electron {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      top: -8px;
      left: calc(50% - 8px);
      background: linear-gradient(135deg, var(--accent), #fff);
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.7);
    }

    .hero-sticker {
      position: absolute;
      right: 22px;
      top: 78px;
      z-index: 2;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 12px;
      backdrop-filter: blur(12px);
    }

    .ai-chat-widget {
      position: fixed;
      right: 26px;
      bottom: 26px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .ai-chat-trigger {
      width: 78px;
      height: 78px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .ai-chat-trigger:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 0 18px rgba(18, 214, 243, 0.28));
    }

    .ai-chat-trigger .brand-mark {
      width: 78px;
      height: 78px;
      margin: 0;
      background: linear-gradient(180deg, rgba(17, 31, 53, 0.96), rgba(10, 23, 40, 0.96));
      border-color: rgba(71, 209, 255, 0.22);
      box-shadow: 0 18px 40px rgba(6, 17, 34, 0.38), 0 0 26px rgba(18, 214, 243, 0.18);
    }

    .ai-chat-trigger .brand-orbit-ring,
    .ai-chat-trigger .brand-orbit-ring-two {
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
    }

    .ai-chat-panel {
      width: min(402px, calc(100vw - 32px));
      border-radius: 20px;
      padding: 18px 0 0;
      background: linear-gradient(180deg, rgba(20, 34, 52, 0.96), rgba(28, 39, 59, 0.96));
      border: 1px solid rgba(122, 170, 215, 0.18);
      box-shadow: 0 22px 54px rgba(7, 17, 31, 0.34);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .ai-chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px 16px;
      margin-bottom: 0;
    }

    .ai-chat-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-chat-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 26px;
      line-height: 1;
      transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .ai-chat-close:hover {
      transform: scale(1.06);
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }

    .ai-chat-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-chat-avatar .brand-mark {
      width: 44px;
      height: 44px;
      box-shadow: 0 0 18px rgba(18, 214, 243, 0.24);
    }

    .ai-chat-name {
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
    }

    .ai-chat-status {
      color: #2ee6ff;
      font-size: 13px;
    }

    .ai-chat-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-inline-end: 6px;
      background: #7effd4;
      vertical-align: middle;
    }

    .ai-chat-bubble {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 16px;
      color: var(--text);
      line-height: 1.6;
      font-size: 13px;
      margin: 0 18px 18px;
    }

    .ai-chat-section-label {
      padding: 0 18px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .ai-chat-actions {
      display: grid;
      gap: 2px;
      padding: 0 0 14px;
    }

    .ai-chat-action {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease, padding 0.2s ease;
    }

    .ai-chat-action:hover {
      background: rgba(255,255,255,0.04);
      padding-inline: 22px 18px;
    }

    .ai-chat-action-arrow {
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }

    .ai-chat-input {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 16px 18px 18px;
    }

    .ai-chat-input-shell {
      min-height: 42px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 8px 7px 16px;
    }

    .ai-chat-placeholder {
      color: var(--muted);
      font-size: 14px;
    }

    .ai-chat-send {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      background: linear-gradient(135deg, rgba(18, 214, 243, 0.95), rgba(26, 111, 232, 0.95));
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(18, 214, 243, 0.26);
    }

    .ai-chat-send svg {
      width: 14px;
      height: 14px;
    }

    .app.rtl .ai-chat-widget {
      right: auto;
      left: 22px;
    }

    .card-title {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .wave {
      display: flex;
      gap: 6px;
      align-items: end;
      height: 48px;
    }

    .wave span {
      width: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--primary-strong), var(--secondary));
      animation: equalize 1.2s ease-in-out infinite;
    }

    .wave span:nth-child(2) { animation-delay: -0.2s; }
    .wave span:nth-child(3) { animation-delay: -0.4s; }
    .wave span:nth-child(4) { animation-delay: -0.6s; }
    .wave span:nth-child(5) { animation-delay: -0.8s; }

    .subject-list {
      display: grid;
      gap: 10px;
    }

    .subject-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 13px;
    }

    .subject-item strong {
      color: var(--text);
      font-size: 14px;
    }

    section {
      padding: 26px 0 46px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .section-head h2 {
      margin: 0 0 8px;
      font-size: clamp(30px, 3vw, 46px);
      letter-spacing: -0.04em;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      max-width: 560px;
      line-height: 1.7;
    }

    .grid-3, .grid-4 {
      display: grid;
      gap: 18px;
    }

    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      background: linear-gradient(180deg, rgba(12, 31, 53, 0.78), rgba(8, 22, 38, 0.88));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 22px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transform: translateY(0) scale(1);
      transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      top: -60px;
      right: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94,231,255,0.16), transparent 70%);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 28px 70px rgba(15, 31, 58, 0.42);
      border-color: rgba(91, 163, 255, 0.22);
    }

    .card:hover::after {
      transform: scale(1.15);
      opacity: 0.95;
    }

    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: rgba(22, 37, 64, 0.88);
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 18px;
      overflow: hidden;
      transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
    }

    .icon-badge svg {
      width: 34px;
      height: 34px;
      color: #f0f4ff;
      transition: transform 0.28s ease, color 0.28s ease, filter 0.28s ease;
    }

    .card:hover .icon-badge {
      transform: scale(1.09);
      background: linear-gradient(180deg, rgba(33, 63, 104, 0.95), rgba(25, 43, 75, 0.95));
      border-color: rgba(91, 163, 255, 0.28);
      box-shadow: 0 0 0 1px rgba(91, 163, 255, 0.1), 0 0 28px rgba(91, 163, 255, 0.18);
    }

    .card:hover .icon-badge svg {
      transform: scale(1.08);
      color: #ffffff;
      filter: drop-shadow(0 0 10px rgba(91, 163, 255, 0.85));
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 22px;
      color: var(--text);
    }

    .card p {
      margin: 0;
      line-height: 1.7;
      color: var(--muted);
    }

    .feature-row {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 22px;
      align-items: stretch;
    }

    .timeline {
      display: grid;
      gap: 16px;
    }

    .timeline-item {
      display: flex;
      gap: 16px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .timeline-index {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(26,111,232,0.18), rgba(108,63,232,0.18));
      color: white;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .timeline-item h4 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .timeline-item p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .screen {
      min-height: 100%;
      padding: 22px;
    }

    .screen-panel {
      display: grid;
      gap: 16px;
    }

    .screen-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 10px 14px;
      border-radius: 999px;
      color: #eef3ff;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
    }

    .experiment-panel {
      padding: 20px;
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bar-group {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .bar-group label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .simulation {
      margin-top: 20px;
      border-radius: 24px;
      padding: 18px;
      min-height: 220px;
      background:
        radial-gradient(circle at center, rgba(108,63,232,0.16), transparent 48%),
        rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.06);
      display: grid;
      place-items: center;
    }

    .sim-core {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid rgba(26,111,232,0.35);
    }

    .sim-core::before,
    .sim-core::after {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 2px dashed rgba(139,124,255,0.32);
    }

    .sim-core::after {
      inset: 44px;
      border-color: rgba(167,139,250,0.36);
    }

    .sim-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin: -9px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 24px rgba(255,255,255,0.68);
    }

    .lab-experiment {
      padding: 24px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(12, 29, 49, 0.9), rgba(8, 21, 38, 0.96));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .lab-experiment-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .lab-experiment-head h3 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .lab-experiment-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 720px;
    }

    .lab-tag {
      padding: 10px 14px;
      border-radius: 999px;
      color: #dff7ff;
      background: rgba(18, 214, 243, 0.08);
      border: 1px solid rgba(18, 214, 243, 0.16);
      font-size: 13px;
      white-space: nowrap;
    }

    .induction-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: stretch;
    }

    .induction-stage {
      position: relative;
      min-height: 340px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, #9ed4fb 0%, #87c5f3 100%);
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .induction-stage:active {
      cursor: grabbing;
    }

    .induction-grid-lines {
      position: absolute;
      inset-inline: 0;
      bottom: 18px;
      height: 2px;
      background: rgba(60, 94, 124, 0.35);
      pointer-events: none;
    }

    .coil-shell {
      position: absolute;
      left: 59%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
    }

    .coil-turns {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: none;
    }

    .coil-wire {
      width: 34px;
      height: 92px;
      margin-left: -12px;
      border-radius: 50%;
      border: 4px solid #b56d1d;
      background: transparent;
      box-shadow: inset 0 0 0 1px rgba(255, 202, 117, 0.25);
      opacity: 0.96;
    }

    .coil-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 90px;
      transform: translate(-50%, -50%);
      border-radius: 10px;
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(87, 58, 23, 0.14);
      pointer-events: none;
    }

    .coil-base-wire,
    .coil-base-wire-two {
      position: absolute;
      height: 4px;
      background: #7b4f2d;
      border-radius: 999px;
    }

    .coil-base-wire {
      width: 134px;
      left: 70px;
      top: 133px;
    }

    .coil-base-wire-two {
      width: 118px;
      left: 86px;
      top: 147px;
    }

    .wire-vertical,
    .wire-vertical-two {
      position: absolute;
      width: 4px;
      background: #7b4f2d;
      border-radius: 999px;
      left: 69px;
    }

    .wire-vertical {
      top: 64px;
      height: 69px;
    }

    .wire-vertical-two {
      left: 85px;
      top: 64px;
      height: 83px;
    }

    .bulb-wrap {
      position: absolute;
      left: 30px;
      top: 42px;
      width: 88px;
      height: 88px;
    }

    .bulb-glow {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 241, 163, 0.78), rgba(255, 241, 163, 0.16) 45%, transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.12s linear, transform 0.12s linear;
    }

    .bulb {
      position: absolute;
      left: 6px;
      top: 0;
      width: 56px;
      height: 56px;
      border-radius: 50% 50% 46% 46%;
      background: radial-gradient(circle at 40% 35%, #fffef2 0%, #f2e7b6 36%, #d8d0aa 70%, #b1b1ac 100%);
      border: 2px solid rgba(72, 72, 72, 0.38);
      transform: rotate(-18deg);
      box-shadow: inset 0 -8px 18px rgba(90, 90, 90, 0.2);
    }

    .bulb::before {
      content: "";
      position: absolute;
      left: 20px;
      top: 15px;
      width: 12px;
      height: 20px;
      border-left: 2px solid rgba(92, 92, 92, 0.65);
      border-right: 2px solid rgba(92, 92, 92, 0.65);
      border-radius: 8px;
    }

    .bulb-base {
      position: absolute;
      left: 50px;
      top: 26px;
      width: 24px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(180deg, #d8d8d8, #8f8f8f);
      border: 1px solid rgba(60, 60, 60, 0.35);
      transform: rotate(-18deg);
    }

    .bulb-socket-wire,
    .bulb-socket-wire-two {
      position: absolute;
      width: 4px;
      background: #7b4f2d;
      border-radius: 999px;
      top: 40px;
    }

    .bulb-socket-wire {
      left: 73px;
      height: 24px;
    }

    .bulb-socket-wire-two {
      left: 89px;
      height: 24px;
    }

    .magnet {
      position: absolute;
      top: 50%;
      width: 120px;
      height: 52px;
      margin-top: -26px;
      border-radius: 18px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 18px 32px rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .magnet-guide {
      position: absolute;
      left: 68%;
      top: 50%;
      width: 190px;
      height: 2px;
      background: rgba(76, 110, 145, 0.3);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .magnet-half {
      flex: 1 1 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      color: white;
    }

    .magnet-half.north {
      background: linear-gradient(180deg, #ff5c7a, #d82747);
    }

    .magnet-half.south {
      background: linear-gradient(180deg, #3da5ff, #1267d6);
    }

    .induction-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .field-ring {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(90, 150, 82, 0.95);
      background: rgba(180, 233, 164, 0.36);
      display: grid;
      place-items: center;
    }

    .field-ring::before,
    .field-ring::after {
      content: "";
      position: absolute;
      background: rgba(90, 150, 82, 0.95);
      border-radius: 999px;
    }

    .field-ring::before {
      width: 2px;
      height: 12px;
    }

    .field-ring::after {
      width: 12px;
      height: 2px;
    }

    .field-ring.one {
      right: 82px;
      top: 94px;
    }

    .field-ring.two {
      right: 82px;
      bottom: 94px;
    }

    .field-arrow-left,
    .field-arrow-right {
      position: absolute;
      width: 28px;
      height: 2px;
      background: rgba(90, 150, 82, 0.95);
      top: 50%;
      margin-top: -1px;
    }

    .field-arrow-left {
      right: 176px;
    }

    .field-arrow-right {
      right: 44px;
    }

    .field-arrow-left::after,
    .field-arrow-right::after {
      content: "";
      position: absolute;
      top: -4px;
      width: 10px;
      height: 10px;
      border-top: 2px solid rgba(90, 150, 82, 0.95);
      border-right: 2px solid rgba(90, 150, 82, 0.95);
    }

    .field-arrow-left::after {
      left: 0;
      transform: rotate(-135deg);
    }

    .field-arrow-right::after {
      right: 0;
      transform: rotate(45deg);
    }

    .flux-pulse {
      position: absolute;
      left: 60%;
      top: 50%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(1);
      background: radial-gradient(circle, rgba(255, 239, 135, 0.2), rgba(255, 239, 135, 0.02) 60%, transparent 72%);
      opacity: 0.5;
      filter: blur(2px);
      transition: transform 0.12s linear, opacity 0.12s linear;
    }

    .induction-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .induction-svg .wire-stroke {
      stroke: #7b4f2d;
      stroke-width: 3.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .induction-svg .coil-loop {
      stroke: #b56d1d;
      stroke-width: 3.8;
      fill: none;
    }

    .induction-svg .magnet-label {
      font-size: 14px;
      font-weight: 800;
      fill: #ffffff;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    .induction-svg .field-stroke {
      stroke: #6aa05b;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .induction-panel {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .meter-card,
    .control-card {
      padding: 18px;
      border-radius: 24px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .meter-head strong {
      font-size: 18px;
    }

    .meter-value {
      font-size: 14px;
      color: #b8cfff;
    }

    .meter-track {
      height: 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .meter-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #20d9ff, #4771ff, #8c67ff);
      box-shadow: 0 0 18px rgba(71, 113, 255, 0.3);
      transition: width 0.12s linear;
    }

    .meter-note,
    .control-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .control-row {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .control-row label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      font-size: 14px;
    }

    .control-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .micro-btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, rgba(26,111,232,0.95), rgba(108,63,232,0.95));
    }

    .micro-btn.secondary {
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .experiment-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .experiment-item {
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .experiment-item.active {
      background: linear-gradient(180deg, rgba(26,111,232,0.16), rgba(108,63,232,0.14));
      border-color: rgba(91,163,255,0.24);
    }

    .experiment-item strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    .experiment-item span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .cta {
      margin: 36px 0 60px;
      padding: 30px;
      border-radius: 34px;
      background:
        linear-gradient(135deg, rgba(26,111,232,0.12), rgba(108,63,232,0.12)),
        rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .cta h3 {
      margin: 0 0 10px;
      font-size: clamp(28px, 3vw, 42px);
    }

    .cta p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 700px;
    }

    .footer {
      padding: 22px 0 28px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      flex-wrap: nowrap;
      color: var(--muted);
      font-size: 14px;
    }

    .contact-card {
      margin-top: 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: grid;
      gap: 4px;
      max-width: 320px;
      font-size: 12px;
      line-height: 1.5;
      text-align: start;
      align-self: flex-end;
    }

    .contact-card strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .contact-card a {
      color: var(--primary-strong);
      word-break: break-word;
      font-size: 12px;
    }

    .app.rtl {
      direction: rtl;
    }

    .app.rtl .nav,
    .app.rtl .section-head,
    .app.rtl .footer,
    .app.rtl .screen-top,
    .app.rtl .subject-item,
    .app.rtl .timeline-item,
    .app.rtl .cta,
    .app.rtl .visual-top,
    .app.rtl .bar-group label {
      direction: rtl;
    }

    .app.rtl .hero,
    .app.rtl .section-head,
    .app.rtl .card,
    .app.rtl .cta,
    .app.rtl .footer,
    .app.rtl .timeline-item,
    .app.rtl .subject-item,
    .app.rtl .screen-panel,
    .app.rtl .nav-links,
    .app.rtl .hero p,
    .app.rtl .section-head p {
      text-align: right;
    }

    .app.rtl .nav {
      grid-template-columns: auto 1fr auto;
    }

    .app.rtl .nav-actions {
      justify-content: flex-start;
    }

    .app.rtl .hero-actions,
    .app.rtl .nav-links {
      flex-direction: row-reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-24px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes orbitSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes orbitSpinReverse {
      from { transform: translate(-50%, -50%) rotate(90deg); }
      to { transform: translate(-50%, -50%) rotate(-270deg); }
    }

    @keyframes orbitDot {
      0% { transform: rotate(0deg) translateX(17px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(17px) rotate(-360deg); }
    }

    @keyframes orbitDotReverse {
      0% { transform: rotate(0deg) translateX(21px) rotate(0deg); }
      100% { transform: rotate(-360deg) translateX(21px) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes equalize {
      0%, 100% { height: 12px; }
      50% { height: 42px; }
    }

    @media (max-width: 1100px) {
      .hero,
      .feature-row,
      .grid-4,
      .induction-grid { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: 1fr; }
      .experiment-list { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 820px) {
      .nav {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 16px 18px;
      }
      .nav-links { width: 100%; overflow: auto; padding-bottom: 6px; justify-content: flex-start; gap: 24px; }
      .hero,
      .feature-row,
      .grid-4,
      .induction-grid,
      .hero-stats,
      .cta { grid-template-columns: 1fr; display: grid; }
      .hero-visual { min-height: 540px; }
      .section-head,
      .footer { display: block; }
      .footer > * + * { margin-top: 10px; }
      .experiment-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .nav-actions {
        width: 100%;
        justify-content: space-between;
      }
      .ai-chat-widget {
        left: 16px;
        right: 16px;
        bottom: 16px;
        width: auto;
      }
      .ai-chat-panel {
        width: 100%;
      }
      .app.rtl .ai-chat-widget {
        left: 16px;
        right: 16px;
      }

    const Counter = ({ target, suffix = "", duration = 1600 }) => {
      const [count, setCount] = useState(0);

      useEffect(() => {
        let frame;
        const start = performance.now();
        const step = (time) => {
          const progress = Math.min((time - start) / duration, 1);
          setCount(Math.floor(progress * target));
          if (progress < 1) frame = requestAnimationFrame(step);
        };
        frame = requestAnimationFrame(step);
        return () => cancelAnimationFrame(frame);
      }, [target, duration]);

      return <>{count}{suffix}</>;
    };

      }), [energy, focus, intensity]);

        const clamped = Math.max(0.08, Math.min(0.92, nextPosition));
        const delta = Math.abs(clamped - lastMagnetX.current);
        const coilCenter = 0.58;
        const proximity = Math.max(0, 1 - Math.abs(clamped - coilCenter) / 0.18);
        const movementStrength = delta * 3200;
        const turnFactor = coilTurns / 12;
        const insideBoost = proximity > 0.72 ? 24 * turnFactor : 0;
        const nextSignal = Math.min(100, Math.round(movementStrength * proximity * turnFactor + insideBoost));
        lastMagnetX.current = clamped;
        setMagnetX(clamped);
        setInducedSignal(nextSignal);
      };

        if (!stageRef.current) return;

                          <radialGradient id="bulbGlowSvg" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stopColor="rgba(255,244,170,0.95)" />
                            <stop offset="45%" stopColor="rgba(255,232,124,0.55)" />
                            <stop offset="100%" stopColor="rgba(255,232,124,0)" />
                          </radialGradient>
                          <linearGradient id="bulbGlassSvg" x1="0%" x2="100%" y1="0%" y2="100%">
                            <stop offset="0%" stopColor="#fffef0" />
                            <stop offset="55%" stopColor="#ece0a8" />
                            <stop offset="100%" stopColor="#b8b3a6" />
                          </linearGradient>
                          <linearGradient id="socketSvg" x1="0%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%" stopColor="#d9d9d9" />
                            <stop offset="100%" stopColor="#8d8d8d" />
                          </linearGradient>
                          <linearGradient id="northSvg" x1="0%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%" stopColor="#ff5c7a" />
                            <stop offset="100%" stopColor="#d82747" />
                          </linearGradient>
                          <linearGradient id="southSvg" x1="0%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%" stopColor="#3da5ff" />
                            <stop offset="100%" stopColor="#1267d6" />
                          </linearGradient>
                        </defs>

                        <line x1="0" y1="246" x2="420" y2="246" stroke="rgba(60,94,124,0.38)" strokeWidth="2" />

                        <ellipse cx="45" cy="56" rx={28 + bulbPower * 8} ry={28 + bulbPower * 8} fill="url(#bulbGlowSvg)" opacity={bulbPower} />

                        <g transform="translate(22 22) rotate(-18 28 28)">
                          <path d="M16 10 C4 18, 4 46, 24 56 C40 64, 62 58, 68 40 C74 22, 58 2, 36 2 C28 2, 22 4, 16 10 Z" fill="url(#bulbGlassSvg)" stroke="rgba(72,72,72,0.45)" strokeWidth="2" />
                          <path d="M28 18 C24 22, 24 34, 30 40" className="wire-stroke" style={{ stroke: "rgba(92,92,92,0.65)", strokeWidth: 2 }} />
                          <path d="M36 16 C32 22, 32 36, 38 44" className="wire-stroke" style={{ stroke: "rgba(92,92,92,0.65)", strokeWidth: 2 }} />
                          <rect x="62" y="24" width="22" height="18" rx="4" fill="url(#socketSvg)" stroke="rgba(60,60,60,0.35)" strokeWidth="1.2" />
                        </g>

                        <path className="wire-stroke" d="M86 70 L86 134 L214 134" />
                        <path className="wire-stroke" d="M100 70 L100 148 L214 148" />

                        <g opacity={0.96}>
                          {coilLoopOffsets.map((cx, index) => (
                            <ellipse key={index} className="coil-loop" cx={cx} cy="141" rx="18" ry="45" />
                          ))}
                        </g>

                        <ellipse
                          cx="264"
                          cy="141"
                          rx={34 + bulbPower * 8}
                          ry={50 + bulbPower * 9}
                          fill="rgba(255,232,124,0.08)"
                          opacity={0.18 + bulbPower * 0.42}
                        />

                        <line x1="282" y1="141" x2="356" y2="141" stroke="rgba(76,110,145,0.3)" strokeWidth="2" />

                        <g transform={`translate(${magnetSvgX} 141)`}>
                          <rect x="-48" y="-20" width="48" height="40" rx="6" fill="url(#northSvg)" stroke="rgba(120,30,48,0.3)" strokeWidth="1" />
                          <rect x="0" y="-20" width="48" height="40" rx="6" fill="url(#southSvg)" stroke="rgba(18,60,130,0.3)" strokeWidth="1" />
                          <text className="magnet-label" x="-24" y="1">N</text>
                          <text className="magnet-label" x="24" y="1">S</text>
                        </g>

                        <g className="field-stroke">
                          <line x1={magnetSvgX} y1="88" x2={magnetSvgX} y2="108" />
                          <path d={`M${magnetSvgX} 84 l-5 7 h10 z`} fill="#6aa05b" stroke="none" />
                          <line x1={magnetSvgX} y1="174" x2={magnetSvgX} y2="154" />
                          <path d={`M${magnetSvgX} 178 l-5 -7 h10 z`} fill="#6aa05b" stroke="none" />
                          <line x1={magnetSvgX - 46} y1="141" x2={magnetSvgX - 26} y2="141" />
                          <path d={`M${magnetSvgX - 50} 141 l7 -5 v10 z`} fill="#6aa05b" stroke="none" />
                          <line x1={magnetSvgX + 26} y1="141" x2={magnetSvgX + 46} y2="141" />
                          <path d={`M${magnetSvgX + 50} 141 l-7 -5 v10 z`} fill="#6aa05b" stroke="none" />
                        </g>
                      </svg>
                    </div>

                    <div className="induction-panel">
                      <div className="meter-card">
                        <div className="meter-head">
                          <strong>{c.outputLabel}</strong>
                          <span className="meter-value">{inducedSignal}% · {c.outputUnit}</span>
                        </div>
                        <div className="meter-track">
                          <div className="meter-fill" style={{ width: `${inducedSignal}%` }}></div>
                        </div>
                        <div className="meter-note">{c.physicsHint}</div>
                      </div>

                      <div className="control-card">
                        <div className="control-row">
                          <label>
                            <span>{c.turnsLabel}</span>
                            <strong>{coilTurns}</strong>
                          </label>
                          <input
                            type="range"
                            min="6"
                            max="18"
                            value={coilTurns}
                            onChange={(event) => setCoilTurns(Number(event.target.value))}
                          />
                        </div>

                        <div className="control-row">
                          <label>
                            <span>{c.magnetLabel}</span>
                            <strong>{Math.round(magnetX * 100)}%</strong>
                          </label>
                          <input
                            type="range"
                            min="8"
                            max="92"
                            value={Math.round(magnetX * 100)}
                            onChange={(event) => updateMagnetPosition(Number(event.target.value) / 100)}
                          />
                        </div>

                        <div className="control-actions">
                          <button className="micro-btn" type="button" onClick={() => updateMagnetPosition(0.5)}>{c.insertMagnet}</button>
                          <button className="micro-btn secondary" type="button" onClick={() => updateMagnetPosition(0.16)}>{c.resetMagnet}</button>
                        </div>

                        <div className="control-note">{c.physicsLabText}</div>
                      </div>
                    </div>
                  </div>

                  <div className="experiment-list">
                    {c.experimentList.map((item, index) => (
                      <div className={`experiment-item ${index === 0 ? "active" : ""}`} key={item.title}>
                        <strong>{item.title}</strong>
                        <span>{item.text}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="feature-row">
                  <div className="card">
                    <div className="timeline">
                      {c.steps.map((step, index) => (
                        <div className="timeline-item" key={step.title}>
                          <div className="timeline-index">0{index + 1}</div>
                          <div>
                            <h4>{step.title}</h4>
                            <p>{step.text}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="card screen">
                    <div className="screen-panel">
                      <div className="screen-top">
                        {c.pills.map((pill) => <div className="pill" key={pill}>{pill}</div>)}
                      </div>
                      <div className="grid-4">
                        {c.subjects.map((subject) => (
                          <div className="experiment-panel" key={subject.name}>
                            <div className="card-title">{subject.name}</div>
                            <p>{subject.note}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <div className="cta" id="about">
                <div>
                  <h3>{c.ctaTitle}</h3>
                  <p>{c.ctaText}</p>
                </div>
                <div className="nav-actions">
                  <button className="btn btn-secondary">{c.bookDemo}</button>
                  <button className="btn btn-primary">{c.getStarted}</button>
                </div>
              </div>

              <footer className="footer" id="contact">
                <div className="footer-summary">
                  {c.footer.map((item) => <div key={item}>{item}</div>)}
                </div>
                <div className="contact-card">
                  <strong>{c.contactTitle}</strong>
                  <div>{c.contactNameLabel}: {c.contactName}</div>
                  <div>{c.contactPhoneLabel}: {c.contactPhone}</div>
                  <div>
                    {c.contactLinkedInLabel}:{" "}
                    <a href="https://www.linkedin.com/in/salma-moath-/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3B6PS4y5SvTTy8eCqiFVwt1g%3D%3D" target="_blank" rel="noreferrer">
                      linkedin.com/in/salma-moath-
                    </a>
                  </div>
                </div>
              </footer>

              <div className="ai-chat-widget">
                {chatOpen ? (
                  <div className="ai-chat-panel">
                    <div className="ai-chat-head">
                      <div className="ai-chat-brand">
                        <div className="ai-chat-avatar">
                          <span className="brand-mark">
                            <span className="brand-orbit-ring"></span>
                            <span className="brand-orbit-ring-two"></span>
                            <span className="brand-nucleus"></span>
                            <span className="brand-orbit-dot"></span>
                            <span className="brand-orbit-dot-two"></span>
                          </span>
                        </div>
                        <div>
                          <div className="ai-chat-name">{c.chatName}</div>
                          <div className="ai-chat-status">{c.chatStatus}</div>
                        </div>
                      </div>
                      <button
                        className="ai-chat-close"
                        onClick={() => setChatOpen(false)}
                        aria-label="Close chat"
                        type="button"
                      >
                        ×
                      </button>
                    </div>
                    <div className="ai-chat-bubble">{c.chatMessage}</div>
                    <div className="ai-chat-section-label">{c.chatLabel}</div>
                    <div className="ai-chat-actions">
                      <button className="ai-chat-action" type="button">
                        <span>{c.chatPrimary}</span>
                        <span className="ai-chat-action-arrow">›</span>
                      </button>
                      <button className="ai-chat-action" type="button">
                        <span>{c.chatSecondary}</span>
                        <span className="ai-chat-action-arrow">›</span>
                      </button>
                    </div>
                    <div className="ai-chat-input">
                      <div className="ai-chat-input-shell">
                        <span className="ai-chat-placeholder">{c.chatPlaceholder}</span>
                        <button className="ai-chat-send" type="button" aria-label="Send">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M5 12h14"></path>
                            <path d="m13 6 6 6-6 6"></path>
                          </svg>
                        </button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <button
                    className="ai-chat-trigger"
                    onClick={() => setChatOpen(true)}
                    aria-label="Open NAWA AI Coach"
                    type="button"
                  >
                    <span className="brand-mark">
                      <span className="brand-orbit-ring"></span>
                      <span className="brand-orbit-ring-two"></span>
                      <span className="brand-nucleus"></span>
                      <span className="brand-orbit-dot"></span>
                      <span className="brand-orbit-dot-two"></span>
                    </span>
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
